<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tawltai - Check</title>
  <link rel="stylesheet" href="css/app.css" />

  <script defer src="lang/ar.js"></script>
  <script defer src="lang/ku.js"></script>
  <script defer src="lang/en.js"></script>

  <script defer src="js/i18n.js"></script>
  <script defer src="js/settings.js"></script>

  <!-- Firebase later: we will add firebase scripts here -->
  <script defer src="js/check.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="appname" data-i18n="app_name"></div>
        <div class="city"><span data-i18n="city"></span></div>
      </div>
    </div>

    <div class="lang">
      <button class="chip" onclick="setLang('ar')">AR</button>
      <button class="chip" onclick="setLang('ku')">KU</button>
      <button class="chip" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <main class="container">
    <div id="checkWrap" class="cards"></div>
  </main>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tawltai - My Bookings</title>
  <link rel="stylesheet" href="../shared/css/app.css" />
  <script defer src="../shared/lang/ar.js"></script>
  <script defer src="../shared/lang/ku.js"></script>
  <script defer src="../shared/lang/en.js"></script>
  <script defer src="../shared/js/i18n.js"></script>
  <script defer src="../shared/js/settings.js"></script>
  <script type="module" defer src="../js/bookings.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="appname" data-i18n="app_name"></div>
        <div class="city"><span data-i18n="city"></span></div>
      </div>
    </div>
    <div class="lang">
      <button class="chip" onclick="setLang('ar')">AR</button>
      <button class="chip" onclick="setLang('ku')">KU</button>
      <button class="chip" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <main class="container">
    <div class="title" style="margin:10px 0;">🎟️ <span data-i18n="my_bookings"></span></div>

    <!-- Login prompt for anonymous users -->
    <div id="loginPrompt" class="auth-banner" style="display:none;">
      <div class="meta" style="opacity:1; margin-bottom:8px;" data-i18n="login_to_save"></div>
      <a class="btn primary" href="./login.html" style="display:block; text-align:center;" data-i18n="login"></a>
    </div>

    <div id="bookingsList" class="cards"></div>
  </main>

  <nav class="bottomnav">
    <a class="navitem" href="../index.html">
      <span class="nav-icon">🏠</span>
      <span data-i18n="events"></span>
    </a>
    <a class="navitem active" href="./my-bookings.html">
      <span class="nav-icon">🎟️</span>
      <span data-i18n="my_bookings"></span>
    </a>
    <a class="navitem" href="./login.html">
      <span class="nav-icon">👤</span>
      <span data-i18n="my_profile"></span>
    </a>
  </nav>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tawltai - Check</title>
  <link rel="stylesheet" href="css/app.css" />

  <script defer src="lang/ar.js"></script>
  <script defer src="lang/ku.js"></script>
  <script defer src="lang/en.js"></script>

  <script defer src="js/i18n.js"></script>
  <script defer src="js/settings.js"></script>

  <!-- Firebase later: we will add firebase scripts here -->
  <script type="module" src="js/check.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="appname" data-i18n="app_name"></div>
        <div class="city"><span data-i18n="city"></span></div>
      </div>
    </div>

    <div class="lang">
      <button class="chip" onclick="setLang('ar')">AR</button>
      <button class="chip" onclick="setLang('ku')">KU</button>
      <button class="chip" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <main class="container">
    <div id="authCard" class="card">
  <div class="content" style="width:100%;">
    <div class="row">
      <div class="title">🔐 Staff Login</div>
    </div>

    <input id="email" class="search" type="email" placeholder="Email" style="margin-top:10px;">
    <input id="password" class="search" type="password" placeholder="Password" style="margin-top:10px;">

    <button id="loginBtn" class="btn primary" style="width:100%; margin-top:10px;">Login</button>
    <button id="logoutBtn" class="btn" style="width:100%; margin-top:10px; display:none;">Logout</button>

    <div id="authMsg" class="meta" style="margin-top:10px;"></div>
  </div>
</div>

<div id="checkWrap"></div>
    <div id="checkWrap" class="cards"></div>
  </main>
</body>
</html>
